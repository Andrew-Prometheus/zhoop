# Builds Zhoop on a GitHub-hosted Mac, signs it with the Apple Developer account,
# and uploads it to TestFlight. Run from Actions: "Zhoop TestFlight" > Run workflow.
# Also runs on the 1st of every month so a fresh build replaces the old one well
# before TestFlight's 90-day expiry.
#
# Required repo secrets:
#   BUNDLE_ID_PREFIX, TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8

name: Zhoop TestFlight

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:
    inputs:
      include_watch:
        description: "Include the Apple Watch app"
        type: boolean
        default: false
      xcode_version:
        description: "Xcode version on the runner (for example 26.5)"
        type: string
        default: "26.5"

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      ARCHIVE: ${{ github.workspace }}/../Zhoop.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/../export
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode_version || '26.5' }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write signing config
        run: |
          cat > Config/BundleIdSecrets.xcconfig <<EOF
          BUNDLE_ID_PREFIX = ${{ secrets.BUNDLE_ID_PREFIX }}
          DEVELOPMENT_TEAM = ${{ secrets.TEAM_ID }}
          EOF

      - name: Drop the Watch app (unless requested)
        if: ${{ !inputs.include_watch }}
        run: |
          sed -i '' '/^      - target: NOOPWatch$/d' project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      # After xcodegen: it rewrites Info.plist from project.yml, dropping earlier edits.
      - name: Skip the export-compliance prompt on every upload
        run: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" StrandiOS/Resources/Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" StrandiOS/Resources/Info.plist

      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Check API key works
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          openssl pkey -in "$KEY_PATH" -noout && echo "Key file parses OK"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os, time, jwt, urllib.request, urllib.error
          now = int(time.time())
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600,
                            "aud": "appstoreconnect-v1"}, open(os.environ["KEY_PATH"]).read(),
                           algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=1",
                                       headers={"Authorization": "Bearer " + tok})
          try:
              print("App Store Connect API status:", urllib.request.urlopen(req).status)
          except urllib.error.HTTPError as e:
              print("App Store Connect API status:", e.code)
              raise SystemExit(1)
          PY

      - name: Archive (Xcode cloud-managed signing)
        run: |
          xcodebuild archive \
            -project Strand.xcodeproj \
            -scheme NOOPiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to TestFlight
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_DIR" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      # GitHub disables scheduled workflows in public repos after 60 days without a commit,
      # so each scheduled build leaves an empty commit behind to keep the schedule alive.
      - name: Keep the monthly schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Monthly TestFlight build ${{ github.run_number }}"
          git push

      - name: Clean up key
        if: always()
        run: rm -f "$KEY_PATH"
